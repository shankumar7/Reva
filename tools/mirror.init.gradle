// Gradle init script: send Maven Central / Google / plugin portal downloads through the local mirror.
// Use:  gradle -I tools/mirror.init.gradle ...      (start tools/maven-mirror.mjs first)
def PORT = System.getenv('MIRROR_PORT') ?: '8899'
def mirrors = [
  [re: /https?:\/\/(repo\.maven\.apache\.org|repo1\.maven\.org)\/maven2\/?.*/, path: 'central'],
  [re: /https?:\/\/(maven\.google\.com|dl\.google\.com\/dl\/android\/maven2)\/?.*/, path: 'google'],
  [re: /https?:\/\/plugins\.gradle\.org\/m2\/?.*/, path: 'plugins'],
]
// runs for every repository the moment it is added, and re-points the known public ones at the mirror
def rewrite = { repo ->
  if (repo instanceof MavenArtifactRepository) {
    def u = repo.url.toString()
    def m = mirrors.find { u ==~ it.re }
    if (m) {
      repo.url = "http://127.0.0.1:${PORT}/${m.path}/"
      repo.allowInsecureProtocol = true
    }
  }
}
beforeSettings { s ->
  s.pluginManagement.repositories.all(rewrite)
  s.dependencyResolutionManagement.repositories.all(rewrite)
}
beforeProject { p ->
  p.buildscript.repositories.all(rewrite)
  p.repositories.all(rewrite)
}
