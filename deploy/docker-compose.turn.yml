# The call relay. Phones talk to each other directly when they can; this helps when they cannot.
name: turn
services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: reva-turn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    mem_limit: 160m
    read_only: true
    tmpfs: [/tmp, /var/lib/coturn]
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }
